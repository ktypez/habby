<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>HABBY — Todos & XP</title>
    <meta name="description" content="Crush your tasks, level up." />
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%8E%AF%3C/text%3E%3C/svg%3E" />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="HABBY — Todos & XP" />
    <meta property="og:description" content="Crush your tasks, level up." />
    <meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#121212" media="(prefers-color-scheme: dark)" />
    <style>
      @font-face{font-family:'JetBrains Mono';src:url('/fonts/JetBrainsMono-latin.woff2') format('woff2');font-weight:100 800;font-style:normal;font-display:swap;}
    </style>
    <script>
      (function(){try{var t=localStorage.getItem('habby-theme');if(t)document.documentElement.setAttribute('data-theme',t);else document.documentElement.setAttribute('data-theme','light');}catch(e){document.documentElement.setAttribute('data-theme','light');}})();
    </script>
    <link rel="stylesheet" href="/css/style.css" />
  </head>
  <body>
    <!-- APP (always visible — no login gate) -->
    <div id="app">
      <!-- HEADER -->
      <header class="header">
        <div class="header-inner">
          <div class="header-brand">
            <span class="header-logo" id="logoBtn" title="triple-tap for owner login">🎯</span>
            <span class="header-title">HABBY</span>
          </div>
          <div class="header-actions">
            <button class="btn-header-icon" id="themeBtn" title="Theme picker">🎨</button>
            <button class="btn-header-icon" id="digestBtn" title="Daily Digest">📋</button>
            <button class="btn-header-icon" id="statsBtn" title="Statistics">📊</button>
            <button class="btn-header-icon" id="notifBtn" title="Notification settings">🔔</button>
            <button class="btn-header-icon" id="logoutBtn" title="Lock app">🚪</button>
            <span class="stat-badge" id="openBadge">📌 0</span>
          </div>
        </div>
        <!-- XP Bar -->
        <div class="xp-header" id="xpHeader">
          <div class="xp-header-inner">
            <span class="xp-level-badge" id="xpLevelBadge">LVL 1</span>
            <div class="xp-bar-track">
              <div class="xp-bar-fill" id="xpBarFill" style="width:0%"></div>
            </div>
            <span class="xp-numbers" id="xpNumbers">0 / 100 XP</span>
          </div>
        </div>
      </header>

      <main class="main" role="main">
        <!-- ADD TASK FORM -->
        <section class="add-todo-section">
          <div class="add-todo-card">
            <h2 class="add-todo-title">NEW TASK</h2>
            <div class="add-todo-form">
              <div class="emoji-picker" id="emojiPicker">
                <button class="emoji-option selected" data-emoji="✅">✅</button>
                <button class="emoji-option" data-emoji="🔥">🔥</button>
                <button class="emoji-option" data-emoji="📚">📚</button>
                <button class="emoji-option" data-emoji="💪">💪</button>
                <button class="emoji-option" data-emoji="💧">💧</button>
                <button class="emoji-option" data-emoji="🧠">🧠</button>
                <button class="emoji-option" data-emoji="✍️">✍️</button>
                <button class="emoji-option" data-emoji="📧">📧</button>
                <button class="emoji-option" data-emoji="📅">📅</button>
                <button class="emoji-option" data-emoji="🛒">🛒</button>
                <button class="emoji-option" data-emoji="🧹">🧹</button>
                <button class="emoji-option" data-emoji="💻">💻</button>
                <button class="emoji-option" data-emoji="🏃">🏃</button>
                <button class="emoji-option" data-emoji="🥗">🥗</button>
                <button class="emoji-option" data-emoji="🚿">🚿</button>
                <button class="emoji-option" data-emoji="🌙">🌙</button>
              </div>

              <div class="add-todo-input-row">
                <input type="text" id="todoInput" class="todo-input" placeholder="e.g. Finish the report..." maxlength="80" autocomplete="off" />
                <button id="addTodoBtn" class="btn-add">+ ADD</button>
              </div>

              <div class="add-todo-options">
                <label class="option-field">
                  <span class="option-label">PRIORITY</span>
                  <select id="prioritySelect" class="priority-select">
                    <option value="low">🟢 LOW</option>
                    <option value="medium" selected>🟡 MED</option>
                    <option value="high">🔴 HIGH</option>
                  </select>
                </label>
                <label class="option-field">
                  <span class="option-label">DUE DATE</span>
                  <input type="date" id="dueDateInput" class="date-input" />
                </label>
              </div>
            </div>
          </div>
        </section>

        <!-- TASKS -->
        <section class="todos-section">
          <div class="section-head">
            <h2 class="section-title" id="listTitle">ALL TASKS</h2>
            <span class="section-sub" id="todosCount">0 tasks</span>
          </div>

          <div class="filter-tabs" id="filterTabs">
            <button class="filter-tab active" data-filter="all">ALL</button>
            <button class="filter-tab" data-filter="today">TODAY <span class="filter-count" id="countToday">0</span></button>
            <button class="filter-tab" data-filter="upcoming">UPCOMING</button>
            <button class="filter-tab" data-filter="done">DONE <span class="filter-count" id="countDone">0</span></button>
          </div>

          <div class="todos-list" id="todosList">
            <!-- Populated by JS -->
          </div>
          <div class="empty-state" id="emptyState">
            <div class="empty-icon">🏆</div>
            <h3 class="empty-title" id="emptyTitle">All clear!</h3>
            <p class="empty-text" id="emptyText">Add a task above and start earning XP.</p>
            <button class="empty-cta" id="emptyCta">+ ADD A TASK</button>
          </div>
        </section>
      </main>

      <!-- DIGEST MODAL -->
      <div class="modal-overlay hidden" id="digestModal">
        <div class="modal-card modal-card-wide">
          <div class="modal-header">
            <span class="modal-title" id="digestTitle">📋 Today's Digest</span>
            <button class="modal-close" id="digestModalClose">✕</button>
          </div>
          <div id="digestContent">
            <!-- Populated by JS -->
          </div>
        </div>
      </div>

      <!-- STATS DASHBOARD MODAL -->
      <div class="modal-overlay hidden" id="statsModal">
        <div class="modal-card modal-card-wide">
          <div class="modal-header">
            <span class="modal-title">📊 STATS</span>
            <button class="modal-close" id="statsModalClose">✕</button>
          </div>
          <div class="stats-grid" id="statsGrid">
            <!-- Populated by JS -->
          </div>
        </div>
      </div>

      <!-- NOTIFICATION SETTINGS MODAL -->
      <div class="modal-overlay hidden" id="notifModal">
        <div class="modal-card">
          <div class="modal-header">
            <span class="modal-title">🔔 Reminders</span>
            <button class="modal-close" id="notifModalClose">✕</button>
          </div>
          <div class="notif-form">
            <label class="notif-toggle-row">
              <span>Daily reminder</span>
              <div class="toggle-track" id="notifToggle">
                <div class="toggle-knob"></div>
              </div>
            </label>
            <label class="notif-time-row">
              <span>Reminder time</span>
              <input type="time" id="notifTime" class="notif-time-input" value="09:00" />
            </label>
            <button class="btn-modal primary btn-full" id="notifTestBtn">🔔 TEST NOTIFICATION</button>
          </div>
        </div>
      </div>

      <!-- TOAST -->
      <div class="toast-container" id="toastContainer"></div>
    </div>

    <script type="module" src="/js/main.js"></script>
  </body>
</html>
