<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Taskflow — Professional Todo</title>
    <meta name="description" content="Stay focused. Get things done." />
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='20' fill='%234F46E5'/%3E%3Cpath d='M30 50 L45 65 L70 35' stroke='%23ffffff' stroke-width='10' fill='none' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="apple-touch-icon" href="/icons/icon-192.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Taskflow" />
    <meta name="color-scheme" content="light dark" />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Taskflow — Professional Todo" />
    <meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0f172a" media="(prefers-color-scheme: dark)" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <script>
      (function(){try{var t=localStorage.getItem('taskflow-theme');if(t)document.documentElement.setAttribute('data-theme',t);else document.documentElement.setAttribute('data-theme',window.matchMedia('(prefers-color-scheme:dark)').matches?'dark':'light');}catch(e){document.documentElement.setAttribute('data-theme','light');}})();
    </script>
    <link rel="stylesheet" href="/css/style.css" />
  </head>
  <body>
    <a class="skip-link" href="#main">Skip to main content</a>
    <div id="app">
      <!-- HEADER -->
      <header class="header">
        <div class="header-inner">
          <div class="header-brand">
            <div class="header-logo-mark" aria-hidden="true"></div>
            <h1 class="header-title">TASKFLOW</h1>
          </div>
          <div class="header-actions">
            <span class="streak-badge hidden" id="streakBadge"></span>
            <button class="btn-icon" id="achievementsBtn" aria-label="View achievements">
              <svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="8" cy="6" r="4"/><path d="M5 10l-1 5 3-2 3 2-1-5"/></svg>
            </button>
            <button class="btn-icon" id="digestBtn" aria-label="Today's digest">
              <svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="3" width="12" height="11" rx="2"/><line x1="2" y1="7" x2="14" y2="7"/><line x1="6" y1="3" x2="6" y2="14"/></svg>
            </button>
            <button class="btn-icon" id="statsBtn" aria-label="View statistics">
              <svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><line x1="2" y1="12" x2="2" y2="8"/><line x1="6" y1="12" x2="6" y2="4"/><line x1="10" y1="12" x2="10" y2="6"/><line x1="14" y1="12" x2="14" y2="2"/></svg>
            </button>
            <button class="btn-icon" id="themeBtn" aria-label="Toggle theme">
              <svg id="themeIcon" width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="8" cy="8" r="3"/><path d="M8 1v2M8 13v2M1 8h2M13 8h2M3.5 3.5l1.4 1.4M11.1 11.1l1.4 1.4M3.5 12.5l1.4-1.4M11.1 4.9l1.4-1.4"/></svg>
            </button>
          </div>
        </div>
        <!-- XP Bar -->
        <div class="xp-header" id="xpHeader">
          <div class="xp-header-inner">
            <span class="xp-level-badge" id="xpLevelBadge">LVL 1</span>
            <div class="xp-bar-track">
              <div class="xp-bar-fill" id="xpBarFill" style="width:0%"></div>
            </div>
            <span class="xp-numbers" id="xpNumbers">0 / 100 XP</span>
          </div>
        </div>
      </header>

      <main class="main" id="main" role="main">
        <!-- ADD TASK FORM -->
        <section class="add-todo-section">
          <div class="add-todo-card">
            <h2 class="add-todo-title">NEW TASK</h2>
            <div class="add-todo-form">
              <div class="add-todo-input-row">
                <input type="text" id="todoInput" class="todo-input" placeholder="What needs to be done?" maxlength="120" autocomplete="off" aria-label="Add a task" />
                <button id="addTodoBtn" class="btn-add">ADD</button>
              </div>
              <div class="add-todo-options">
                <label class="option-field">
                  <span class="option-label">PRIORITY</span>
                  <select id="prioritySelect" class="priority-select">
                    <option value="low">Low</option>
                    <option value="medium" selected>Medium</option>
                    <option value="high">High</option>
                  </select>
                </label>
                <label class="option-field">
                  <span class="option-label">DUE DATE</span>
                  <input type="date" id="dueDateInput" class="date-input" />
                </label>
                <label class="option-field">
                  <span class="option-label">REPEAT</span>
                  <select id="repeatSelect" class="priority-select">
                    <option value="none" selected>None</option>
                    <option value="daily">Daily</option>
                    <option value="weekly">Weekly</option>
                    <option value="monthly">Monthly</option>
                  </select>
                </label>
              </div>
            </div>
          </div>
        </section>

        <!-- TASKS -->
        <section class="todos-section">
          <div class="section-head">
            <div class="section-head-left">
              <h2 class="section-title" id="listTitle">ALL TASKS</h2>
              <span class="section-sub" id="todosCount">0 tasks</span>
            </div>
            <div class="section-head-tools">
              <input type="search" id="searchInput" class="search-input" placeholder="Search…" autocomplete="off" aria-label="Search tasks" />
              <select id="sortSelect" class="sort-select" title="Sort order">
                <option value="priority" selected>PRIORITY</option>
                <option value="due">BY DUE DATE</option>
                <option value="newest">NEWEST</option>
              </select>
            </div>
          </div>

          <div class="filter-tabs" id="filterTabs">
            <button class="filter-tab active" data-filter="all">ALL</button>
            <button class="filter-tab" data-filter="today">TODAY <span class="filter-count" id="countToday">0</span></button>
            <button class="filter-tab" data-filter="upcoming">UPCOMING</button>
            <button class="filter-tab" data-filter="done">DONE <span class="filter-count" id="countDone">0</span></button>
          </div>

          <div class="todos-list" id="todosList"></div>
          <div class="empty-state" id="emptyState">
            <div class="empty-icon">
              <svg width="48" height="48" viewBox="0 0 48 48" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 14l12 12L39 10"/><rect x="4" y="4" width="40" height="40" rx="6"/></svg>
            </div>
            <h3 class="empty-title" id="emptyTitle">All clear</h3>
            <p class="empty-text" id="emptyText">Add a task above to get started.</p>
            <button class="empty-cta" id="emptyCta">+ ADD A TASK</button>
          </div>
        </section>
      </main>

      <!-- CONFIRM DELETE MODAL -->
      <div class="modal-overlay hidden" id="confirmDeleteModal">
        <div class="modal-card modal-card-sm">
          <div class="modal-header">
            <span class="modal-title">Delete task?</span>
            <button class="modal-close" id="confirmDeleteClose">
              <svg width="14" height="14" viewBox="0 0 14 14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><line x1="1" y1="1" x2="13" y2="13"/><line x1="13" y1="1" x2="1" y2="13"/></svg>
            </button>
          </div>
          <p class="confirm-text">"<span id="confirmDeleteName"></span>" will be permanently removed.</p>
          <div class="modal-actions">
            <button class="btn-modal" id="confirmCancel">CANCEL</button>
            <button class="btn-modal btn-danger" id="confirmDelete">DELETE</button>
          </div>
        </div>
      </div>

      <!-- DIGEST MODAL -->
      <div class="modal-overlay hidden" id="digestModal">
        <div class="modal-card modal-card-wide">
          <div class="modal-header">
            <span class="modal-title" id="digestTitle">Today's Digest</span>
            <button class="modal-close" id="digestModalClose">
              <svg width="14" height="14" viewBox="0 0 14 14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><line x1="1" y1="1" x2="13" y2="13"/><line x1="13" y1="1" x2="1" y2="13"/></svg>
            </button>
          </div>
          <div id="digestContent"></div>
        </div>
      </div>

      <!-- STATS MODAL -->
      <div class="modal-overlay hidden" id="statsModal">
        <div class="modal-card modal-card-wide">
          <div class="modal-header">
            <span class="modal-title">Statistics</span>
            <button class="modal-close" id="statsModalClose">
              <svg width="14" height="14" viewBox="0 0 14 14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><line x1="1" y1="1" x2="13" y2="13"/><line x1="13" y1="1" x2="1" y2="13"/></svg>
            </button>
          </div>
          <div class="stats-grid" id="statsGrid"></div>
        </div>
      </div>

      <!-- TOAST -->
      <div class="toast-container" id="toastContainer" role="log" aria-live="polite" aria-label="Notifications"></div>
    </div>

    <script type="module" src="/js/main.js"></script>
  </body>
</html>
